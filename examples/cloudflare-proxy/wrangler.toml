name = "aethex-signaling-proxy"
main = "worker.js"
compatibility_date = "2024-11-01"

# Public, non-secret config. Override per environment as needed.
[vars]
AETHEX_BASE_URL = "https://api.aethexai.com"
# Comma-separated allowed browser origins for CORS, or "*" for any (dev only).
ALLOWED_ORIGINS = "http://localhost:3000"
# Optional comma-separated UUID allowlist. Empty = allow any agent_id.
ALLOWED_AGENT_IDS = ""

# Secrets are NOT stored here. Set them with:
#   wrangler secret put AETHEX_API_KEY
# For local dev, put them in .dev.vars (see .dev.vars.example).
